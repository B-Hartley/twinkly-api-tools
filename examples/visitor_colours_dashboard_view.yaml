title: Visitor Colour Match
path: visitor-colours
icon: mdi:palette
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - type: heading
        heading: Visitor controls
        icon: mdi:palette
      - type: tile
        entity: switch.twinkly_area_manager_visitor_master_enable
        name: Master visitor enable
        icon: mdi:power
      - type: entities
        title: Master operating hours
        entities:
          - entity: select.twinkly_area_manager_visitor_morning_start
            name: Morning from
          - entity: select.twinkly_area_manager_visitor_morning_end
            name: Morning until
          - entity: select.twinkly_area_manager_visitor_evening_start
            name: Evening from
          - entity: select.twinkly_area_manager_visitor_evening_end
            name: Evening until
        grid_options:
          columns: 12
          rows: auto
      - type: tile
        entity: switch.twinkly_area_manager_visitor_colour_match
        name: Enable colour matching
        icon: mdi:palette
      - type: tile
        entity: select.twinkly_area_manager_visitor_announcement_speaker
        name: Announcement speaker
        features:
          - type: select-options
        features_position: bottom
        grid_options:
          columns: 12
          rows: auto
      - type: entities
        title: Timing and fallback
        entities:
          - entity: select.twinkly_area_manager_visitor_cooldown_minutes
            name: Minimum minutes between AI attempts
          - entity: select.twinkly_area_manager_visitor_start_time
            name: AI matching from
          - entity: select.twinkly_area_manager_visitor_end_time
            name: AI matching until
          - entity: switch.twinkly_area_manager_visitor_button_flourish
            name: Random flourish and next movie
        grid_options:
          columns: 12
          rows: auto
      - type: button
        name: Test full button sequence
        icon: mdi:gesture-tap-button
        tap_action:
          action: perform-action
          perform_action: twinkly_area_state.visitor_button
      - type: button
        name: Match visitors now
        icon: mdi:palette-swatch
        tap_action:
          action: perform-action
          perform_action: twinkly_area_state.match_visitor_colours
      - type: button
        name: Test announcement
        icon: mdi:volume-high
        tap_action:
          action: perform-action
          perform_action: twinkly_area_state.test_visitor_speaker
      - type: tile
        entity: sensor.twinkly_christmas_show_status
        name: Show status
      - type: tile
        entity: switch.twinkly_area_manager_maintenance_mode
        name: Maintenance mode
      - type: markdown
        content: |
          Enable matching, select the speaker and press the driveway Zigbee button.
          A prepared or running show takes priority. Outside the master morning/evening hours, visitor button actions do nothing. Inside those hours, outside the additional AI window or during cooldown, the button runs a short flourish and advances the Front movie. Equal master start/end disables that period; equal AI start/end permits AI throughout master hours.
          In night vision, reliable visitor/dog counts light one bush per subject (maximum six). Test announcement uses no camera image. Matching sends an image to the configured AI provider.
  - type: grid
    cards:
      - type: heading
        heading: Approach camera
        icon: mdi:cctv
      - type: picture-entity
        entity: camera.approach
        camera_view: live
        show_name: false
        show_state: false
        grid_options:
          columns: 12
          rows: auto
      - type: heading
        heading: Bush lights
        icon: mdi:string-lights
      - type: tile
        entity: light.twinkly_front_left_bush
        name: Front left
      - type: tile
        entity: light.twinkly_front_right_left_bush
        name: Front right L
      - type: tile
        entity: light.twinkly_front_right_right_bush
        name: Front right R
      - type: tile
        entity: light.twinkly_mid_right
        name: Mid right
      - type: tile
        entity: light.twinkly_back_right_bush
        name: Back right
      - type: tile
        entity: light.twinkly_back_left_bush
        name: Back left
