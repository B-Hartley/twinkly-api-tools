title: Christmas Lights
views:
  - title: Master Settings
    path: master-settings
    icon: mdi:tune-variant
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Area Manager
            heading_style: title
            icon: mdi:shield-cog
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.twinkly_area_manager_maintenance_mode
                name: Maintenance Kill Switch
                icon: mdi:network-off
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: |-
              {% if is_state('switch.twinkly_area_manager_maintenance_mode','on') %}
              🔴 **Maintenance active** — Area Manager communications suspended. Use the Twinkly app.
              {% elif is_state('switch.twinkly_area_manager_maintenance_mode','off') %}
              🟢 **Normal operation** — Area Manager communications enabled. Christmas show and virtual lights available.
              {% else %}
              🟠 **Area Manager unavailable**
              {% endif %}
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: Maintenance mode suspends Area Manager communications. The visitor master switch only controls visitor-button activity; it does not disable a prepared Christmas show or ordinary light controls.
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Visitor master schedule
            heading_style: title
            icon: mdi:calendar-clock
          - type: tile
            entity: switch.twinkly_area_manager_visitor_master_enable
            name: Master visitor enable
            icon: mdi:power
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: |-
              {% set p = 'select.twinkly_area_manager_visitor_' %}
              {% set ms, me = states(p ~ 'morning_start'), states(p ~ 'morning_end') %}
              {% set es, ee = states(p ~ 'evening_start'), states(p ~ 'evening_end') %}
              {% set t = now().strftime('%H:%M') %}
              {% set valid = ms not in ['unknown','unavailable'] and me not in ['unknown','unavailable'] and es not in ['unknown','unavailable'] and ee not in ['unknown','unavailable'] %}
              {% set morning = ms != me and ((ms <= t < me) if ms < me else (t >= ms or t < me)) %}
              {% set evening = es != ee and ((es <= t < ee) if es < ee else (t >= es or t < ee)) %}
              {% if not is_state('switch.twinkly_area_manager_maintenance_mode', 'off') %}
              **Unavailable / maintenance mode**
              {% elif not is_state('switch.twinkly_area_manager_visitor_master_enable','on') %}
              **Visitor button disabled**
              {% elif not valid %}
              **Operating hours unavailable**
              {% elif states('sensor.twinkly_christmas_show_status') in ['preparing','ready','starting','running','stopping'] %}
              **Christmas programme has priority**
              {% elif morning or evening %}
              **Within operating hours** — visitor button enabled.
              {% else %}
              **Outside operating hours** — visitor button inactive.
              {% endif %}

              Morning: {{ ms }}–{{ me }} · Evening: {{ es }}–{{ ee }}
            grid_options:
              columns: 12
              rows: auto
          - type: entities
            title: Master operating hours
            entities:
              - entity: select.twinkly_area_manager_visitor_morning_start
                name: Morning from
              - entity: select.twinkly_area_manager_visitor_morning_end
                name: Morning until
              - entity: select.twinkly_area_manager_visitor_evening_start
                name: Evening from
              - entity: select.twinkly_area_manager_visitor_evening_end
                name: Evening until
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: Equal start and finish disables that period. The schedule gates visitor AI and fallback lighting, not the main Christmas show or the power state of lights.
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Button & fallback
            heading_style: title
            icon: mdi:gesture-tap-button
          - type: tile
            entity: switch.twinkly_area_manager_visitor_button_flourish
            name: Random flourish and next movie
            icon: mdi:string-lights
            grid_options:
              columns: 12
              rows: auto
          - type: button
            name: Test full button sequence
            icon: mdi:gesture-tap-button
            tap_action:
              action: perform-action
              perform_action: twinkly_area_state.visitor_button
            grid_options:
              columns: 12
              rows: auto
            visibility:
              - condition: state
                entity: switch.twinkly_area_manager_maintenance_mode
                state: 'off'
              - condition: state
                entity: sensor.twinkly_christmas_show_status
                state_not:
                  - preparing
                  - ready
                  - starting
                  - running
                  - stopping
                  - unknown
                  - unavailable
              - condition: state
                entity: switch.twinkly_area_manager_visitor_master_enable
                state: 'on'
          - type: markdown
            content: A prepared Christmas programme takes priority. Otherwise, during master operating hours the button tries eligible AI matching first. If matching is disabled, in cooldown or unsuccessful, it runs a random seven-second flourish then advances the stored Front movie. The full-sequence test respects these same restrictions.
            grid_options:
              columns: 12
              rows: auto
  - title: Show Settings
    path: show-control
    icon: mdi:movie-open-play
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Show status & GO
            heading_style: title
            icon: mdi:pine-tree
          - type: markdown
            content: |-
              {% set s = states('sensor.twinkly_christmas_show_status') %}
              {% set programme = state_attr('sensor.twinkly_christmas_show_status', 'programme') %}
              {% set variant = state_attr('sensor.twinkly_christmas_show_status', 'variant') %}
              {% set titles = {'original': 'V1 · Santa’s Christmas Magic', 'house_chase': 'V2 · Father Christmas and the Cheeky Elf', 'elf_chase_v3': 'V3 · The Elf, the Car and the Fairy Lights'} %}
              {% set title = 'Countdown · Landing' if programme == 'countdown' else titles.get(variant, 'Christmas show') %}
              {% if not is_state('switch.twinkly_area_manager_maintenance_mode','off') %}

              ## Maintenance mode / unavailable

              Turn off maintenance mode to prepare or start a programme.

              {% elif s in ['unknown', 'unavailable'] %}
              ## Show controls need the update
              Install the latest **Twinkly Area Manager update** and restart Home Assistant. Normal light controls are available on the **Lights** tab.
              {% elif s == 'ready' %}
              ## Ready for GO
              **{{ title }}** is prepared and Twinkly is dark. For audio programmes, Sonos is paused at the beginning. House, drive and door lights can stay as normal while you wait.

              Press **GO** below, or your Zigbee button once its automation is installed. Preparation expires after **15 minutes**. To choose another programme or preset, cancel and prepare again.
              {% elif s == 'preparing' %}
              ## Preparing your programme
              Checking and preparing the display, including silently loading Sonos if audio is enabled. House lighting stays normal. GO will appear when preparation is complete.
              {% elif s in ['starting', 'running'] %}
              ## {{ 'Starting' if s == 'starting' else 'Show running' }}
              **{{ title }}**

              Use **Stop / cancel** to end the programme and restore the house lights.
              {% elif s == 'stopping' %}
              ## Stopping and restoring
              Releasing the soundtrack and restoring the house lights. Please wait.
              {% elif s == 'finished' %}
              ## Programme finished
              {% if programme == 'show' %}The final movie continues on Front. **Stop / cancel** will turn it off.{% else %}The countdown is complete.{% endif %}
              {% elif s == 'expired' %}
              ## Preparation expired
              Prepare your chosen programme again when you are ready.
              {% elif s == 'error' %}
              ## The programme needs attention
              Read the message below. Use **Stop / cancel** to clear any remaining session before preparing again.
              {% else %}
              ## Ready to prepare
              Choose **V1, V2, V3 or Countdown** below, then press **Prepare selected programme**. Preparation does not start the show. Wait for **Ready**, then press **GO**.
              {% endif %}
              {% set error = state_attr('sensor.twinkly_christmas_show_status', 'last_error') %}
              {% if error and s in ['error', 'expired'] %}
              **Message:** {{ error }}
              {% endif %}
              {% set warnings = state_attr('sensor.twinkly_christmas_show_status', 'house_light_warnings') or [] %}
              {% if warnings and s in ['ready', 'running', 'error'] %}
              **House-light notes:**
              {% for warning in warnings %}
              - {{ warning }}
              {% endfor %}
              {% endif %}
            grid_options:
              columns: 12
              rows: auto
          - type: button
            name: GO — start prepared programme
            icon: mdi:play-circle
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 64px
            tap_action:
              action: perform-action
              perform_action: twinkly_area_state.start_prepared_show
            hold_action:
              action: none
            grid_options:
              columns: 12
              rows: 3
            visibility:
              - condition: state
                entity: sensor.twinkly_christmas_show_status
                state: ready
              - condition: state
                entity: switch.twinkly_area_manager_maintenance_mode
                state: 'off'
          - type: button
            name: Stop / cancel programme
            icon: mdi:stop-circle-outline
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: twinkly_area_state.stop_christmas_show
            hold_action:
              action: none
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: sensor.twinkly_christmas_show_status
                state:
                  - preparing
                  - ready
                  - starting
                  - running
                  - finished
                  - error
              - condition: state
                entity: switch.twinkly_area_manager_maintenance_mode
                state: 'off'
          - type: tile
            entity: binary_sensor.zig_button_binary_input
            name: Zigbee GO button
            icon: mdi:gesture-tap-button
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            grid_options:
              columns: 12
              rows: 1
          - type: markdown
            content: The physical button starts the prepared programme after its separate Home Assistant automation is added. Dashboard buttons work immediately after the integration update.
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Programme & preparation
            heading_style: title
            icon: mdi:playlist-play
          - type: tile
            entity: input_select.christmas_show_programme
            name: Programme
            icon: mdi:playlist-play
            features:
              - type: select-options
            tap_action:
              action: none
            icon_tap_action:
              action: none
            grid_options:
              columns: 12
              rows: 2
          - type: markdown
            content: |-
              {% set p = states('input_select.christmas_show_programme') %}
              {% set descriptions = {'V1': 'Santa’s Christmas Magic — the original show.', 'V2': 'Father Christmas and the Cheeky Elf — the existing house chase.', 'V3': 'The Elf, the Car and the Fairy Lights — Jyggy, a slower room-by-room pursuit and the big finale.', 'Countdown': 'The standalone Landing countdown test.'} %}
              **{{ p }}** · {{ descriptions.get(p, 'Choose a programme in the dropdown.') }}

              The same choice is used by preparation and audio rehearsal. Once prepared, GO always starts the loaded programme; cancel it before choosing another.
            grid_options:
              columns: 12
              rows: auto
          - type: button
            name: Prepare selected programme
            icon: mdi:movie-open-play
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: script.christmas_programme_control
              data:
                command: prepare
                preset: performance
            hold_action:
              action: none
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: switch.twinkly_area_manager_maintenance_mode
                state: 'off'
              - condition: state
                entity: media_player.sonos_move
                state:
                  - idle
                  - paused
                  - standby
                  - 'off'
          - type: markdown
            content: |-
              **Performance:** fairy lights **100%**, house lights **100%**, Sonos at its **current volume** shown on the slider.

              V2 and V3 wake Jyggy during preparation and flash the headlights with the driveway cue. House lights stay normal until GO. V1 and Countdown do not use the house or car.
            grid_options:
              columns: 12
              rows: auto
        visibility:
          - condition: state
            entity: sensor.twinkly_christmas_show_status
            state:
              - idle
              - finished
              - expired
              - error
      - type: grid
        cards:
          - type: heading
            heading: Lighting rehearsal
            heading_style: title
            icon: mdi:test-tube
          - type: markdown
            content: |-
              Uses the same programme dropdown.

              **Quiet rehearsal:** fairy lights **2%**, Sonos **5%**. Countdown uses **20%** digit brightness. V2 and V3 keep house lights at **100%** and include Jyggy’s wake and headlight flash.

              These lighting rehearsals still wait for **GO**. Use **Audio rehearsal** below to listen without operating the lights or car.
            grid_options:
              columns: 12
              rows: auto
          - type: button
            name: Prepare selected · quiet rehearsal
            icon: mdi:volume-low
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: script.christmas_programme_control
              data:
                command: prepare
                preset: quiet
            hold_action:
              action: none
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: media_player.sonos_move
                state:
                  - idle
                  - paused
                  - standby
                  - 'off'
          - type: button
            name: Prepare selected · silent rehearsal
            icon: mdi:volume-off
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: script.christmas_programme_control
              data:
                command: prepare
                preset: silent
            hold_action:
              action: none
            grid_options:
              columns: 12
              rows: 2
          - type: markdown
            content: Silent rehearsal uses the same dim fairy-light preset with no Sonos playback. V2 and V3 still use the house lights and Jyggy.
            grid_options:
              columns: 12
              rows: auto
        visibility:
          - condition: state
            entity: sensor.twinkly_christmas_show_status
            state:
              - idle
              - finished
              - expired
              - error
          - condition: state
            entity: switch.twinkly_area_manager_maintenance_mode
            state: 'off'
      - type: grid
        cards:
          - type: heading
            heading: Audio rehearsal & show volume
            heading_style: title
            icon: mdi:speaker-wireless
          - type: markdown
            content: |-
              {% if states('media_player.sonos_move') in ['unknown', 'unavailable'] %}
              Sonos Move is unavailable. Wake or reconnect it to rehearse or prepare audio.
              {% elif is_state('media_player.sonos_move', 'playing') and states('sensor.twinkly_christmas_show_status') in ['idle', 'finished', 'expired', 'error'] %}
              Stop the audio rehearsal or pause Sonos before preparing a programme.
              {% endif %}
            grid_options:
              columns: 12
              rows: auto
          - type: tile
            entity: media_player.sonos_move
            name: Show volume · Sonos Move
            icon: mdi:speaker-wireless
            features:
              - type: media-player-volume-slider
                show_mute_button: false
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            visibility:
              - condition: state
                entity: sensor.twinkly_christmas_show_status
                state_not:
                  - preparing
                  - starting
                  - stopping
            grid_options:
              columns: 12
              rows: 2
          - type: button
            name: Audio rehearsal · selected programme
            icon: mdi:play-circle
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: script.christmas_programme_control
              data:
                command: audio_rehearsal
            hold_action:
              action: none
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: sensor.twinkly_christmas_show_status
                state:
                  - idle
                  - finished
                  - expired
                  - error
              - condition: state
                entity: media_player.sonos_move
                state:
                  - idle
                  - paused
                  - standby
                  - 'off'
          - type: button
            name: Stop audio rehearsal
            icon: mdi:stop-circle
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: script.christmas_programme_control
              data:
                command: stop_audio
            hold_action:
              action: none
            grid_options:
              columns: 12
              rows: 2
            visibility:
              - condition: state
                entity: sensor.twinkly_christmas_show_status
                state:
                  - idle
                  - finished
                  - expired
                  - error
              - condition: state
                entity: media_player.sonos_move
                state:
                  - playing
                  - paused
          - type: markdown
            content: |-
              {% set volume = state_attr('media_player.sonos_move', 'volume_level') %}
              **Current show volume:** {{ (volume * 100) | round(0) | int ~ '%' if volume is number else 'unavailable' }}.

              The slider controls Sonos directly. Audio rehearsal plays the selected programme at that level; adjust it while listening, stop the audio, then prepare the show. Performance preparation captures this exact setting. Quiet lighting rehearsal uses its separate 5% preset. Stop audio rehearsal only stops one of the four Christmas soundtracks; it leaves unrelated Sonos audio alone.

              Audio rehearsal does not prepare or start the lighting show. It leaves the fairy lights, house lights and Jyggy alone. Sonos must be ungrouped and unmuted.
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Finale movies
            heading_style: title
            icon: mdi:filmstrip
          - type: button
            name: Refresh Front movies
            icon: mdi:refresh
            show_name: true
            show_icon: true
            icon_height: 32px
            tap_action:
              action: perform-action
              perform_action: twinkly_area_state.refresh_movies
            hold_action:
              action: none
            grid_options:
              columns: 12
              rows: 2
          - type: markdown
            content: |-
              **Finale order**

              {% set effects = state_attr('light.twinkly_front','effect_list') or [] %}
              {% set names = ['Eclipse','UpDown','Bright Twinkle','Vertical Flag','Night Sky','Christmas Spirit'] %}
              {% set ns = namespace(missing=[]) %}

              {% for name in names %}
              {% if 'Movie: ' ~ name in effects or 'Movie: ' ~ name[:15] in effects %}
              🟢 {{ loop.index }}. {{ name }}
              {% else %}
              🔴 {{ loop.index }}. {{ name }}
              {% set ns.missing = ns.missing + [name] %}
              {% endif %}

              {% endfor %}
              {% if not ns.missing %}
              **All six required movies available.**
              {% else %}
              **Missing:** {{ ns.missing | join(', ') }}
              {% endif %}
            grid_options:
              columns: 12
              rows: auto
          - type: tile
            entity: light.twinkly_front
            name: Movie brightness
            icon: mdi:brightness-6
            color: amber
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
            hold_action:
              action: more-info
            grid_options:
              columns: 12
              rows: 2
            features:
              - type: light-brightness
          - type: button
            name: Eclipse
            icon: mdi:moon-waning-crescent
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              data:
                effect: 'Movie: Eclipse'
              target:
                entity_id: light.twinkly_front
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
          - type: button
            name: UpDown
            icon: mdi:arrow-up-down
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              data:
                effect: 'Movie: UpDown'
              target:
                entity_id: light.twinkly_front
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
          - type: button
            name: Bright Twinkle
            icon: mdi:star-four-points
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              data:
                effect: 'Movie: Bright Twinkle'
              target:
                entity_id: light.twinkly_front
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
          - type: button
            name: Vertical Flag
            icon: mdi:flag
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              data:
                effect: 'Movie: Vertical Flag'
              target:
                entity_id: light.twinkly_front
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
          - type: button
            name: Night Sky
            icon: mdi:weather-night
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              data:
                effect: 'Movie: Night Sky'
              target:
                entity_id: light.twinkly_front
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
          - type: button
            name: Christmas Spirit
            icon: mdi:pine-tree
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              data:
                effect: 'Movie: Christmas Spirit'
              target:
                entity_id: light.twinkly_front
            hold_action:
              action: none
            grid_options:
              columns: 6
              rows: 2
          - type: button
            name: Front off
            icon: mdi:string-lights-off
            show_name: true
            show_icon: true
            show_state: false
            icon_height: 38px
            tap_action:
              action: perform-action
              perform_action: light.turn_off
              target:
                entity_id: light.twinkly_front
            hold_action:
              action: none
            grid_options:
              columns: 12
              rows: 2
        visibility:
          - condition: state
            entity: sensor.twinkly_christmas_show_status
            state_not:
              - preparing
              - ready
              - starting
              - running
              - stopping
          - condition: state
            entity: switch.twinkly_area_manager_maintenance_mode
            state: 'off'
  - title: AI Settings
    path: visitor-colours
    icon: mdi:robot-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: AI visitor matching
            heading_style: title
            icon: mdi:palette
          - type: tile
            entity: switch.twinkly_area_manager_visitor_colour_match
            name: Enable AI visitor matching
            icon: mdi:palette
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: >-
              **Daylight:** OpenAI AI Task picks one or two standout colours from visitors' clothing, accessories or dogs, and illuminates the bushes to match.
              **Night vision:** when colours are unreliable, AI counts the people and dogs instead. One festive bush per person, one light-blue bush per dog, up to six in total. Unused bushes turn off. Larger groups light all six.
              An uncertain or empty scene falls through to the normal random flourish and next movie when enabled. Both modes use the same AI request, master schedule, additional AI time window, cooldown and selected speaker. No second AI call is needed. The camera image is sent to the configured AI provider only on an eligible attempt.
            grid_options:
              columns: 12
              rows: auto
          - type: entities
            title: AI timing & cooldown
            entities:
              - entity: select.twinkly_area_manager_visitor_cooldown_minutes
                name: Minimum minutes between AI attempts
              - entity: select.twinkly_area_manager_visitor_start_time
                name: Additional AI window from
              - entity: select.twinkly_area_manager_visitor_end_time
                name: Additional AI window until
            grid_options:
              columns: 12
              rows: auto
          - type: markdown
            content: Set the two additional AI times equal to allow matching throughout both master periods. Cooldown limits attempts, including unsuccessful ones.
            grid_options:
              columns: 12
              rows: auto
          - type: button
            name: Test AI visitor matching
            icon: mdi:palette-swatch
            tap_action:
              action: perform-action
              perform_action: twinkly_area_state.match_visitor_colours
            grid_options:
              columns: 12
              rows: auto
            visibility:
              - condition: state
                entity: switch.twinkly_area_manager_maintenance_mode
                state: 'off'
              - condition: state
                entity: sensor.twinkly_christmas_show_status
                state_not:
                  - preparing
                  - ready
                  - starting
                  - running
                  - stopping
                  - unknown
                  - unavailable
              - condition: state
