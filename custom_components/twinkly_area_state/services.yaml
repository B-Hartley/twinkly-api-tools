capture_groups:
  name: Capture live group(s)
  description: Save immutable local 2D group geometry and uploaded movie metadata. Requires full master/slave group and does not write to lights. Cloud Area is verified only by the separate CLI.
capture_3d_maps:
  name: Capture original 3D map(s)
  description: Save immutable original 3D mapping only from currently standalone 3D controllers. Grouped 2D maps cannot be treated as original 3D.
verify_archives:
  name: Verify saved groups and 3D maps
  description: Read live controllers and compare applicable saved LED coordinates and hardware identities. Does not change lights or cloud groups.
save_state:
  name: Save named Twinkly state
  description: Capture and retain raw local controller responses and X/Y/Z LED coordinates by name. Existing named state will be replaced.
  fields:
    name:
      name: State name
      required: true
      selector:
        text: {}
restore_state:
  name: Inspect restore of named state (dry run)
  description: Compare a saved state against the current devices and report issues. NEVER sends grouping or layout writes.
  fields:
    name:
      name: State name
      required: true
      selector:
        text: {}
office_window_plan:
  name: Propose equal-sized office windows (dry run)
  description: Calculate an equal-width 2D two-window arrangement with a one-window-width horizontal gap. NEVER modifies lights.
  fields:
    name:
      name: Source state name
      required: true
      selector:
        text: {}
    left:
      name: Left window controller name
      required: true
      selector:
        text: {}
    right:
      name: Right window controller name
      required: true
      selector:
        text: {}

resume_movie:
  name: Resume native movie
  description: Stop Office virtual streaming and return control to the native Twinkly movie.

import_3d_maps:
  name: Import 3D map archives
  description: Import private CLI reference files from /config/twinkly_3d_import/by-mac. Verify live controller MAC and LED count without changing group membership or layouts.

  fields:
    overwrite:
      name: Overwrite existing 3D maps
      description: Replace conflicting saved references, retaining the previous versions.
      default: false
      selector:
        boolean: {}
    allow_unverified:
      name: Import unavailable or unconfigured controllers
      description: Accept checksum-validated references without live identity verification. Known LED count mismatches are still rejected.
      default: false
      selector:
        boolean: {}
    confirmation:
      name: Confirmation
      description: Type IMPORT to enable either option above.
      selector:
        text: {}

verify_cloud_session:
  name: Verify cloud session
  description: Read cloud installations, automatically renewing the cached cloud token if needed. Does not change light sets or groups.

rescan_controllers:
  name: Rescan native Twinkly controllers
  description: Reload Area Manager to refresh controller inventory and virtual lights. Stops any active show.

start_christmas_show:
  name: Start Santa's Christmas Magic
  description: Prepare the display, then run the 140-second soundtrack and synchronised light score. Requires the version 2 audio pack and at least one shared stored Front movie. Starts only when explicitly called.
  fields:
    audio:
      name: Play soundtrack
      description: Disable only for an intentional silent lighting rehearsal.
      default: true
      selector:
        boolean: {}
    audio_base:
      name: Soundtrack folder URL
      description: The speaker-accessible folder containing christmas_show_v2.mp3.
      example: https://home-assistant.example/local/christmas_lights_on/christmas_audio
      selector:
        text: {}
    brightness_pct:
      name: Show brightness
      default: 2
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    volume:
      name: Speaker volume
      default: 0.05
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
    offset_ms:
      name: Light timing adjustment
      description: Positive delays the lights; negative advances them. Adjust only after a local rehearsal.
      default: 0
      selector:
        number:
          min: -2000
          max: 2000
          step: 50
          unit_of_measurement: ms

stop_christmas_show:
  name: Stop Santa's Christmas Magic
  description: Stop the soundtrack and turn off this show's display, including a stored movie left running after the finale.
