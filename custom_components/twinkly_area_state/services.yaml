stop_countdown_test:
  name: Stop countdown test
  description: Stop the shared show session, its audio and lights.

replace_group_reference:
  name: Replace verified 2D group reference
  description: Compare /config/twinkly_group_candidate.json with fresh controller reads and replace only its matching saved group reference. Retains previous reference and all original 3D maps. No device or cloud writes.
  fields:
    confirmation:
      name: Confirmation
      required: true
      example: REPLACE GROUP REFERENCE
      selector:
        text: {}

refresh_movies:
  name: Refresh stored movies
  description: Read shared movie catalogues and update effect lists without reloading or changing playback. Stop active programmes or streaming first.

match_visitor_colours:
  name: Match visitor clothing colours
  description: When Visitor colour match is enabled and the show is idle, analyse the Approach camera using Home Assistant AI Task, feature one or two standout colours from visitors or dogs on the six bush zones, and announce the items on the selected speaker. Skips uncertain images and native movies.

test_visitor_speaker:
  name: Test visitor announcement speaker
  description: Speak a short test phrase on the selected speaker without using the camera or changing lights. Refuses during a prepared or running show.

visitor_button:
  name: Visitor button action
  description: When no Christmas show is prepared or running, try the enabled and eligible AI match; otherwise run a short random Front chase and advance the available stored movie. Respects maintenance mode and the flourish switch.
