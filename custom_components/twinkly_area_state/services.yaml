start_prepared_show:
  name: Start prepared programme (Go)
  description: Start whichever show or countdown is ready, using its saved settings. Refuses if nothing is ready.
    Suitable for a Zigbee button; never loads a different track or silently starts preparation.
stop_christmas_show:
  name: Stop Christmas show or preparation
  description: Cancel preparation or playback, release owned audio, stop the retained final movie and restore house
    lights captured at Go.
start_countdown_test:
  name: Test Landing countdown (legacy action)
  description: Compatibility alias for Start Landing countdown. Uses the new British countdown soundtrack.
  fields:
    audio:
      name: Play soundtrack
      description: Enable soundtrack (default true). Omitted Start options inherit the prepared programme.
      selector:
        boolean: {}
    audio_base:
      name: Soundtrack folder URL
      description: Folder containing landing_countdown_british_v1.mp3.
