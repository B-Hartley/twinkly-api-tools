    audio_base:
      name: Soundtrack folder URL
      description: Speaker-accessible folder containing the selected soundtrack. Original uses christmas_show_v2.mp3;
        V2 uses christmas_show_house_chase_v1.mp3; V3 uses christmas_show_elf_chase_v3.mp3.
      example: https://home-assistant.example/local/christmas_lights_on/christmas_audio
      selector:
        text: {}
    brightness_pct:
      name: Twinkly brightness
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: '%'
      description: 0–100%; default 2 for a dim Twinkly rehearsal. Independent of house brightness.
    volume:
